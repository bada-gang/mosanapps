<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모산 교육자료 모음</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f6f8fc;
    --surface: #ffffff;
    --text: #1b2333;
    --muted: #5f6b80;
    --line: #e4e9f2;
    --primary: #2f6feb;
    --primary-soft: #e8f0ff;
    --mint: #3cc8b4;
    --yellow: #ffc845;
    --shadow: 0 1px 2px rgba(20, 40, 80, .06), 0 8px 24px rgba(20, 40, 80, .06);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Malgun Gothic", "맑은 고딕", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  /* 상단 바 */
  .topbar { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .topbar .wrap { display: flex; align-items: center; gap: 12px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
  .brand img { width: 34px; height: 34px; border-radius: 10px; object-fit: cover; }
  .topbar .spacer { flex: 1; }
  .admin-link { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; font-size: 14px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; background: var(--surface); transition: all .15s; }
  .admin-link:hover { color: var(--primary); border-color: #c9d4e6; }
  .admin-link svg { width: 16px; height: 16px; }

  /* 히어로 */
  .hero { background: #fefcfd; border-bottom: 1px solid var(--line); }
  .hero .hero-in { display: grid; grid-template-columns: 1fr 1fr; max-width: 1200px; margin: 0 auto; }
  /* 그림 칸을 정사각형으로 고정해 어떤 화면 폭에서도 그림이 잘리지 않게 함 */
  .hero .art { aspect-ratio: 1 / 1; background: url('assets/hero-square.jpg') center / cover no-repeat; }
  @media (min-width: 1201px) {
    /* 큰 화면에서 그림 왼쪽 끝이 배경과 자연스럽게 이어지도록 */
    .hero .art { -webkit-mask-image: linear-gradient(to right, transparent 0, #000 9%); mask-image: linear-gradient(to right, transparent 0, #000 9%); }
  }
  .hero .text { align-self: center; max-width: 580px; padding: 48px 40px 48px 56px; }
  .hero .eyebrow { display: inline-block; font-size: 13px; font-weight: 700; color: var(--primary); background: var(--primary-soft); padding: 6px 12px; border-radius: 999px; }
  .hero h1 { margin: 14px 0 10px; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.2; letter-spacing: -.03em; font-weight: 800; }
  .hero h1 em { font-style: normal; color: var(--primary); }
  .hero p { margin: 0; color: var(--muted); font-size: 17px; }

  /* 검색 · 필터 */
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 32px 0 20px; }
  .search { flex: 1 1 260px; position: relative; }
  .search input { width: 100%; height: 48px; padding: 0 16px 0 44px; font: inherit; font-size: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; }
  .search input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
  .search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { height: 40px; padding: 0 16px; font: inherit; font-size: 15px; font-weight: 600; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; transition: all .15s; }
  .chip:hover { border-color: #c9d4e6; color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* 카드 */
  .grid { display: grid; grid-template-columns: var(--cols, repeat(auto-fill, minmax(240px, 1fr))); gap: 16px; padding-bottom: 56px; }
  .card { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s, border-color .15s; }
  a.card:hover { transform: translateY(-3px); border-color: #cfdcf5; box-shadow: 0 2px 4px rgba(20,40,80,.06), 0 16px 32px rgba(20,40,80,.10); }
  a.card:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
  .card .head { display: flex; align-items: center; gap: 14px; }
  .card .icon { flex: none; width: 56px; height: 56px; border-radius: 16px; object-fit: cover; background: var(--primary-soft); }
  .card h3 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
  .card .cat { font-size: 13px; font-weight: 700; color: var(--primary); }
  .card p { margin: 0; color: var(--muted); font-size: 15px; flex: 1; }
  .card .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; font-weight: 600; color: #3b4a63; background: #f0f3f8; padding: 4px 9px; border-radius: 8px; }
  .go { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; color: var(--primary); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 0; }
  /* 전체 보기에서 지난 자료 앞에 넣는 구분선 */
  .divider { grid-column: 1 / -1; height: 1px; margin: 16px 0; background: var(--line); }
  .card.archived { background: #fbfcfe; box-shadow: none; }

  footer { border-top: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px; }
  footer .wrap { padding-top: 24px; padding-bottom: 32px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }

  @media (max-width: 760px) {
    .hero .hero-in { grid-template-columns: 1fr; }
    .hero .text { padding: 24px 20px 32px; }
    .grid { --cols: repeat(auto-fill, minmax(240px, 1fr)) !important; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="#"><img src="assets/logo.png" alt="">모산 교육자료 모음</a>
      <span class="spacer"></span>
      <a class="admin-link" href="admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>관리자</a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-in">
      <div class="art" role="img" aria-label="작은 학교에서 넓은 세상을 바라보는 아이들 그림"></div>
      <div class="text">
        <span class="eyebrow" id="eyebrow"></span>
        <h1 id="heroTitle"></h1>
        <p id="heroText"></p>
      </div>
    </div>
  </section>

  <main class="wrap">
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="앱 이름이나 학년·교과로 검색" aria-label="앱 검색">
      </label>
      <div class="chips" id="chips" role="group" aria-label="분류"></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <div class="wrap">
      <span>강릉 모산초등학교 · 2026 AI·디지털 활용 선도학교</span>
      <span id="footCount">모산 교육자료 모음</span>
    </div>
  </footer>

<script src="apps.js"></script>
<script>
  const SITE = window.SITE || {};
  const APPS = (window.APPS || []).filter(a => a.url && a.visible !== false);
  const DEFAULT_ICON = "assets/app-default.png";
  // 이 분류의 앱은 '전체' 보기에서 구분선 아래에 따로 표시 (apps.js의 SITE.archiveCategories로 바꿀 수 있음)
  const ARCHIVE = SITE.archiveCategories || ["지난 홍보"];
  const grid = document.getElementById("grid");
  const chips = document.getElementById("chips");
  const q = document.getElementById("q");
  let current = "전체";

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rich = s => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>").replace(/\n/g, "<br>");

  // 상단 문구와 레이아웃
  document.getElementById("eyebrow").textContent = SITE.eyebrow || "";
  document.getElementById("eyebrow").hidden = !SITE.eyebrow;
  document.getElementById("heroTitle").innerHTML = rich(SITE.heroTitle || "모산 교육자료 모음");
  document.getElementById("heroText").innerHTML = rich(SITE.heroText || "");
  if (+SITE.columns >= 1) grid.style.setProperty("--cols", `repeat(${+SITE.columns}, 1fr)`);
  document.getElementById("footCount").textContent = `모산 교육자료 모음 · 앱 ${APPS.length}개`;

  const cats = ["전체", ...new Set(APPS.map(a => a.category).filter(Boolean))];
  chips.innerHTML = cats.map(c => `<button class="chip" type="button" aria-pressed="${c === current}">${esc(c)}</button>`).join("");
  chips.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    current = b.textContent;
    chips.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  });
  q.addEventListener("input", render);

  function card(a) {
    const tags = (a.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
    const inner = `
      <div class="head">
        <img class="icon" src="${esc(a.icon || DEFAULT_ICON)}" alt="" onerror="this.src='${DEFAULT_ICON}'">
        <div><div class="cat">${esc(a.category)}</div><h3>${esc(a.title)}</h3></div>
      </div>
      <p>${esc(a.desc)}</p>
      <div class="foot"><div class="tags">${tags}</div><span class="go">열기 →</span></div>`;
    return `<a class="card" href="${esc(a.url)}" target="_blank" rel="noopener">${inner}</a>`;
  }

  function render() {
    const k = q.value.trim().toLowerCase();
    const list = APPS.filter(a =>
      (current === "전체" || a.category === current) &&
      (!k || [a.title, a.desc, a.category, ...(a.tags || [])].join(" ").toLowerCase().includes(k)));
    if (!list.length) { grid.innerHTML = `<div class="empty">찾는 앱이 없어요. 다른 검색어를 입력해 보세요.</div>`; return; }
    // 전체 보기: 지금 쓰는 앱을 먼저, 더 이상 쓰지 않는 앱(ARCHIVE 분류)은 구분선 아래에 따로 모음
    const old = current === "전체" ? list.filter(a => ARCHIVE.includes(a.category)) : [];
    const now = list.filter(a => !old.includes(a));
    grid.innerHTML = now.map(card).join("") +
      (old.length ? `<div class="divider" aria-hidden="true"></div>` +old.map(a => card(a).replace('class="card"', 'class="card archived"')).join("") : "");
  }
  render();
</script>
</body>
</html>
